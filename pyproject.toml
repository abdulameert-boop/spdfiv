[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spdfiv"
version = "0.1.0"
description = "Defactored IV estimation of spatial dynamic panel data models with interactive effects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Abdul Amir Taima Bandar", email = "Abdulameer.t@uokerbala.edu.iq" },
  { name = "Ahmed Turki Abd Ali", email = "Ahmed.turki@uokerbala.edu.iq" },
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]
keywords = ["panel data", "spatial econometrics", "instrumental variables",
            "common factors", "interactive effects"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/abdulameert-boop/spdfiv"
Issues = "https://github.com/abdulameert-boop/spdfiv/issues"

[project.optional-dependencies]
excel = ["openpyxl"]

[tool.setuptools]
packages = ["spdfiv"]
